
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanji Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="title-block">
      <p class="eyebrow">漢字カード</p>
      <h1>Kanji Flashcards</h1>
    </header>

    <div id="card" class="card" aria-live="polite">
      <div id="front" class="side"></div>
      <div id="back" class="side hidden" aria-hidden="true"></div>
    </div>

    <div class="controls">
      <button type="button" id="showBtn">Show answer</button>
      <button type="button" id="nextBtn">Next card</button>
      <button type="button" id="shuffleBtn" class="secondary">Shuffle</button>
    </div>

    <div id="reviewArea" class="review-area hidden" aria-hidden="true">
      <p class="review-question">Did you understand this kanji?</p>
      <div class="review-buttons">
        <button type="button" id="understoodBtn">わかった！</button>
        <button type="button" id="practiceBtn">もう少し練習</button>
      </div>
    </div>
  </main>

  <!-- Celebration message -->
  <aside
    id="praiseArea"
    class="praise-area hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="praiseMessage"
    aria-hidden="true"
  >
    <button
      type="button"
      id="closePraiseBtn"
      class="close-praise"
      aria-label="Close"
    >&times;</button>

    <h2 id="praiseMessage">Well done!</h2>
    <p>You're doing great! Keep learning!</p>
  </aside>

  <script src="script.js"></script>
</body>
</html>
